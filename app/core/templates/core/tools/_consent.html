<div class="consent-banner" id="analytics-consent" hidden>
    <section
        class="consent-panel"
        role="dialog"
        aria-labelledby="analytics-consent-title"
        aria-describedby="analytics-consent-description"
    >
        <h2 id="analytics-consent-title">Optional analytics</h2>
        <p id="analytics-consent-description">
            Google Analytics helps us understand how the site is used. It loads only if you accept analytics.
            Your choice is stored locally in this browser so we can remember it.
        </p>
        <div class="consent-actions">
            <button class="button button-secondary" id="analytics-reject" type="button">Reject</button>
            <button class="button" id="analytics-accept" type="button">Accept analytics</button>
        </div>
    </section>
</div>

<script>
    (() => {
        "use strict";

        const measurementId = "G-GJ3PP8PF5J";
        const consentKey = "web-privacy-analytics-consent";
        const disableKey = `ga-disable-${measurementId}`;
        const banner = document.getElementById("analytics-consent");
        const accept = document.getElementById("analytics-accept");
        const reject = document.getElementById("analytics-reject");
        const settings = document.getElementById("analytics-settings");
        let returnFocusToSettings = false;

        const readConsent = () => {
            try {
                const consent = window.localStorage.getItem(consentKey);
                return consent === "granted" || consent === "denied" ? consent : null;
            } catch {
                return null;
            }
        };

        const saveConsent = (value) => {
            try {
                window.localStorage.setItem(consentKey, value);
            } catch {
                // The current-page choice still applies when storage is unavailable.
            }
        };

        const updateConsent = (value) => {
            if (typeof window.gtag === "function") {
                window.gtag("consent", "update", {
                    analytics_storage: value,
                    ad_storage: "denied",
                    ad_user_data: "denied",
                    ad_personalization: "denied",
                });
            }
        };

        const loadGoogleAnalytics = () => {
            window[disableKey] = false;
            if (window.webPrivacyAnalyticsLoaded) {
                updateConsent("granted");
                return;
            }

            window.dataLayer = window.dataLayer || [];
            window.gtag = function () { window.dataLayer.push(arguments); };
            window.gtag("consent", "default", {
                analytics_storage: "denied",
                ad_storage: "denied",
                ad_user_data: "denied",
                ad_personalization: "denied",
            });
            window.gtag("consent", "update", {
                analytics_storage: "granted",
                ad_storage: "denied",
                ad_user_data: "denied",
                ad_personalization: "denied",
            });
            window.gtag("js", new Date());
            window.gtag("config", measurementId);

            const script = document.createElement("script");
            script.async = true;
            script.src = `https://www.googletagmanager.com/gtag/js?id=${encodeURIComponent(measurementId)}`;
            script.dataset.analytics = "google";
            document.head.append(script);
            window.webPrivacyAnalyticsLoaded = true;
        };

        const showConsent = (focusActions = false) => {
            banner.hidden = false;
            settings.setAttribute("aria-expanded", "true");
            returnFocusToSettings = focusActions;
            if (focusActions) {
                try {
                    reject.focus({preventScroll: true});
                } catch {
                    reject.focus();
                }
            }
        };

        const hideConsent = () => {
            banner.hidden = true;
            settings.setAttribute("aria-expanded", "false");
            if (returnFocusToSettings) settings.focus();
            returnFocusToSettings = false;
        };

        accept.addEventListener("click", () => {
            saveConsent("granted");
            loadGoogleAnalytics();
            hideConsent();
        });

        reject.addEventListener("click", () => {
            saveConsent("denied");
            window[disableKey] = true;
            updateConsent("denied");
            hideConsent();
        });

        settings.addEventListener("click", () => { showConsent(true); });
        banner.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                event.preventDefault();
                hideConsent();
            }
        });

        const consent = readConsent();
        if (consent === "granted") {
            loadGoogleAnalytics();
        } else {
            window[disableKey] = true;
            if (consent === "denied") {
                hideConsent();
            } else {
                showConsent();
            }
        }
    })();
</script>
