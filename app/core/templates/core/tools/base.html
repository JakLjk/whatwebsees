<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}">
    <link rel="canonical" href="{{ canonical_url }}">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="WhatWebSees">
    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{{ description }}">
    <meta property="og:url" content="{{ canonical_url }}">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ title }}">
    <meta name="twitter:description" content="{{ description }}">
    <meta name="theme-color" content="#2457d6">

    <style>
        :root {
            color-scheme: light;
            --background: #f4f7fb;
            --surface: #ffffff;
            --surface-muted: #f7f9fc;
            --text: #182230;
            --muted: #5d6b7c;
            --border: #dbe3ed;
            --accent: #2457d6;
            --accent-dark: #1945b3;
            --accent-soft: #eaf0ff;
            --success: #17643a;
            --error: #a42828;
            --shadow: 0 18px 48px rgba(29, 47, 75, 0.10);
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(circle at 15% 0%, rgba(36, 87, 214, 0.10), transparent 32rem),
                var(--background);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.6;
        }

        a { color: var(--accent); }

        .page-shell {
            width: min(100% - 2rem, 70rem);
            margin-inline: auto;
        }

        .site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding-block: 1.35rem;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 750;
            letter-spacing: 0.01em;
            text-decoration: none;
        }

        .brand-mark {
            display: grid;
            width: 2rem;
            height: 2rem;
            place-items: center;
            border-radius: 0.65rem;
            background: var(--accent);
            color: #fff;
        }

        .site-nav {
            display: flex;
            gap: 0.85rem;
            align-items: center;
        }

        .site-nav a {
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
        }

        .site-nav a:hover { color: var(--accent); }

        main { padding-block: clamp(1.75rem, 5vw, 4.5rem) 4rem; }

        .breadcrumb {
            margin: 0 0 1rem;
            color: var(--muted);
            font-size: 0.88rem;
        }

        .breadcrumb a { font-weight: 700; }

        .intro {
            max-width: 48rem;
            margin-bottom: clamp(1.8rem, 5vw, 3rem);
        }

        .eyebrow {
            margin: 0 0 0.65rem;
            color: var(--accent);
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1, h2, h3 {
            margin-top: 0;
            line-height: 1.15;
            letter-spacing: -0.025em;
        }

        h1 {
            margin-bottom: 0.85rem;
            font-size: clamp(2.2rem, 6vw, 4.25rem);
        }

        h2 { font-size: clamp(1.35rem, 3vw, 1.9rem); }

        .intro-text {
            margin: 0;
            color: var(--muted);
            font-size: clamp(1rem, 2vw, 1.15rem);
        }

        .card {
            min-width: 0;
            border: 1px solid var(--border);
            border-radius: 1.25rem;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .result-card { padding: clamp(1.35rem, 4vw, 2.25rem); }

        .card-label {
            margin: 0 0 0.55rem;
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .primary-value {
            display: block;
            overflow-wrap: anywhere;
            margin: 1rem 0;
            font-size: clamp(1.5rem, 4vw, 2.7rem);
            font-weight: 780;
            line-height: 1.2;
        }

        .mono {
            font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 0.88rem;
            font-weight: 550;
            letter-spacing: 0;
            user-select: text;
        }

        .primary-value.mono { font-size: clamp(1rem, 2.2vw, 1.25rem); }

        .status {
            margin: 0.75rem 0 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .status.is-error { color: var(--error); font-weight: 700; }
        .status.is-ready { color: var(--success); }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 2.75rem;
            padding: 0.7rem 1rem;
            border: 1px solid var(--accent);
            border-radius: 0.75rem;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-weight: 750;
            cursor: pointer;
        }

        .button:hover { background: var(--accent-dark); }
        .button:disabled { cursor: not-allowed; opacity: 0.6; }

        .button-secondary {
            background: #fff;
            color: var(--accent);
        }

        .button:focus-visible,
        .tool-link:focus-visible,
        .analytics-settings:focus-visible,
        .site-nav a:focus-visible,
        .brand:focus-visible {
            outline: 3px solid rgba(36, 87, 214, 0.25);
            outline-offset: 3px;
        }

        .result-grid,
        .data-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
            gap: 0.75rem;
            margin: 1.25rem 0 0;
        }

        .data-list > div {
            min-width: 0;
            padding: 1rem;
            border-radius: 0.85rem;
            background: var(--surface-muted);
        }

        .data-list .wide { grid-column: 1 / -1; }

        dt {
            margin-bottom: 0.2rem;
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 650;
        }

        dd {
            margin: 0;
            overflow-wrap: anywhere;
            font-weight: 750;
        }

        .privacy-note {
            margin: 1rem 0 0;
            padding: 0.9rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.85rem;
            background: rgba(255, 255, 255, 0.75);
            color: var(--muted);
            font-size: 0.88rem;
        }

        .content-section {
            max-width: 54rem;
            margin-top: clamp(2.25rem, 6vw, 4rem);
        }

        .content-section p,
        .content-section li { color: var(--muted); }

        .content-section h3 { margin: 1.75rem 0 0.45rem; }

        .disclosure {
            overflow: hidden;
            margin-top: 1rem;
            border: 1px solid var(--border);
            border-radius: 1rem;
            background: var(--surface);
        }

        .disclosure summary {
            padding: 1rem 1.2rem;
            cursor: pointer;
            font-weight: 750;
        }

        .disclosure-content {
            padding: 0 1.2rem 1.2rem;
            border-top: 1px solid var(--border);
        }

        .headers-table {
            width: 100%;
            margin-top: 1rem;
            border-collapse: collapse;
        }

        .headers-table th,
        .headers-table td {
            padding: 0.8rem;
            border-bottom: 1px solid var(--border);
            text-align: left;
            vertical-align: top;
            overflow-wrap: anywhere;
        }

        .headers-table th { width: 35%; color: var(--muted); }

        .tool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
            gap: 1rem;
        }

        .tool-card {
            display: flex;
            min-height: 13rem;
            flex-direction: column;
            padding: 1.35rem;
        }

        .tool-card h2 { margin-bottom: 0.55rem; font-size: 1.25rem; }
        .tool-card p { margin: 0 0 1.2rem; color: var(--muted); }

        .tool-link {
            margin-top: auto;
            font-weight: 750;
            text-underline-offset: 0.2rem;
        }

        .site-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            padding-block: 0 2rem;
            color: var(--muted);
            font-size: 0.82rem;
        }

        .analytics-settings {
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--accent);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            text-decoration: underline;
        }

        .consent-banner {
            position: fixed;
            z-index: 1000;
            right: 1rem;
            bottom: 1rem;
            left: 1rem;
            width: min(calc(100% - 2rem), 42rem);
            margin-inline: auto;
        }

        .consent-panel {
            padding: 1.35rem;
            border: 1px solid var(--border);
            border-radius: 1.2rem;
            background: var(--surface);
            box-shadow: 0 20px 60px rgba(29, 47, 75, 0.22);
        }

        .consent-panel h2 { margin-bottom: 0.5rem; font-size: 1.25rem; }
        .consent-panel p { margin: 0; color: var(--muted); font-size: 0.92rem; }

        .consent-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .consent-actions .button-secondary { border-color: var(--border); }

        [hidden] { display: none !important; }

        @media (max-width: 42rem) {
            .site-header { align-items: flex-start; }
            .site-nav { flex-direction: column; align-items: flex-end; gap: 0.25rem; }
            .data-list { grid-template-columns: 1fr; }
            .headers-table, .headers-table tbody, .headers-table tr,
            .headers-table th, .headers-table td { display: block; width: 100%; }
            .headers-table th { padding-bottom: 0.15rem; border-bottom: 0; }
            .headers-table td { padding-top: 0.15rem; }
        }
    </style>
</head>
<body>
    <header class="site-header page-shell">
        <a class="brand" href="/" aria-label="WhatWebSees home">
            <span class="brand-mark" aria-hidden="true">W</span>
            WhatWebSees
        </a>
        <nav class="site-nav" aria-label="Main navigation">
            <a href="/">Home</a>
            <a href="/tools/">All tools</a>
        </nav>
    </header>

    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer page-shell">
        <span>Diagnostic values shown by these tools are not persisted by this application.</span>
        <button class="analytics-settings" id="analytics-settings" type="button">Analytics settings</button>
    </footer>

    {% include "core/tools/_consent.html" %}
    {% include "core/tools/_helpers.html" %}
    {% block scripts %}{% endblock %}
</body>
</html>
