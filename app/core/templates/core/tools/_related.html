{% if related_tools %}
<section class="related-tools" aria-labelledby="related-tools-title">
    <h2 id="related-tools-title">Related tools</h2>
    <div class="related-links">
        {% for tool in related_tools %}
        <a href="{{ tool.path }}">{{ tool.name }}</a>
        {% endfor %}
    </div>
</section>
{% endif %}
{% if related_learn %}
<section class="related-tools" aria-labelledby="related-learn-title">
    <h2 id="related-learn-title">Learn more</h2>
    <div class="related-links">
        {% for article in related_learn %}<a href="{{ article.path }}">{{ article.heading }}</a>{% endfor %}
    </div>
</section>
{% endif %}
