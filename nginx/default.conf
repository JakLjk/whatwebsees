map $http_cf_connecting_ip $normalized_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

map $http_x_forwarded_proto $normalized_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;

    server_name _;

    access_log off;
    error_log /var/log/nginx/error.log warn;

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $normalized_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $normalized_forwarded_proto;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
