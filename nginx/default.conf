map $http_cf_connecting_ip $normalized_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

map $http_x_forwarded_proto $normalized_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Rate-limit only POST requests that make DNS or outbound network connections.
# An empty key is not accounted by nginx, so ordinary browsing and local tools
# are unaffected.
map "$request_method:$uri" $network_tool_rate_key {
    default "";

    ~^POST:/(dns-lookup|dnssec-checker|email-dns-checker|reverse-dns|hostname-lookup|ssl-checker|website-status|server-headers|redirect-checker|security-headers|robots-txt-checker|sitemap-checker|meta-tags-checker|rdap-lookup|domain-age)/$ $normalized_client_ip;
}

limit_req_zone $network_tool_rate_key zone=network_tools_per_ip:10m rate=20r/m;

# Public API limits use only the normalized client address established above.
# User-supplied X-Forwarded-For values are never used as rate-limit keys.
map "$request_method:$uri" $api_network_rate_key {
    default "";

    ~^POST:/api/v1/(http-check|dns|redirects|tls|security-headers|ip)$ $normalized_client_ip;
}

map "$request_method:$uri" $api_local_rate_key {
    default "";

    ~^POST:/api/v1/(subnet|punycode)$ $normalized_client_ip;
}

map "$request_method:$uri" $api_health_rate_key {
    default "";

    "GET:/api/v1/health" $normalized_client_ip;
}

limit_req_zone $api_network_rate_key zone=api_network_per_ip:10m rate=30r/m;
limit_req_zone $api_local_rate_key zone=api_local_per_ip:10m rate=120r/m;
limit_req_zone $api_health_rate_key zone=api_health_per_ip:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;

    server_name _;

    access_log off;
    error_log /var/log/nginx/error.log warn;

    location ^~ /api/v1/ {
        client_max_body_size 4k;
        limit_req zone=api_network_per_ip burst=6 nodelay;
        limit_req zone=api_local_per_ip burst=20 nodelay;
        limit_req zone=api_health_per_ip burst=10 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        error_page 429 = @api_rate_limited;
        error_page 413 = @api_request_too_large;

        proxy_pass http://web:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $normalized_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $normalized_forwarded_proto;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location @api_rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 429 '{"ok":false,"error":{"code":"rate_limited","message":"The public API rate limit was exceeded. Try again later."}}';
    }

    location @api_request_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 413 '{"ok":false,"error":{"code":"request_too_large","message":"The JSON request body must not exceed 4096 bytes."}}';
    }

    location / {
        limit_req zone=network_tools_per_ip burst=8 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;

        proxy_pass http://web:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $normalized_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $normalized_forwarded_proto;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
